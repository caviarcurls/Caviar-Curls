<div class="shop-icons">

<!-- PRODUCT PAGE -->

<section class="product-page">

<!-- PRODUCT IMAGE -->

<div>

<img
id="product-image"
class="main-product-image"
src=""
alt=""
>

<div
class="product-gallery"
id="product-gallery"
aria-label="Product image gallery"
></div>

</div>

<!-- PRODUCT DETAILS -->

<div class="product-details">

<p
class="product-mini"
id="product-type"
>
Luxury Hair
</p>

<h1 id="product-title">
Product
</h1>

<div class="product-stars">No ratings yet</div>

<div class="product-price-wrap">

<span
class="main-price"
id="product-price"
>
£0
</span>

</div>

<p
class="product-description"
id="product-description"
>
Luxury premium hair extensions.
</p>

<!-- TYPE SELECTOR -->

<div
class="selector-group"
id="lace-group"
>

<label id="type-label">
Select Type
</label>

<select id="lace-select">
</select>

</div>

<!-- LENGTH SELECTOR -->

<div class="selector-group">

<label>
Select Length
</label>

<select id="length-select">
</select>

</div>

<!-- BUTTON -->

<button class="luxury-cart-btn">
ADD TO CART
</button>

<div class="product-review-box">

<p class="review-box-label">
Purchased this product?
</p>

<h2>
Rate your product
</h2>

<form id="productReviewForm" class="product-review-form">

<label>
Your rating
<select name="rating" required>
<option value="">Select stars</option>
<option value="5">5 stars</option>
<option value="4">4 stars</option>
<option value="3">3 stars</option>
<option value="2">2 stars</option>
<option value="1">1 star</option>
</select>
</label>

<label>
Name
<input name="name" type="text" placeholder="Your name" maxlength="40">
</label>

<button type="submit">
Submit Rating
</button>

<p id="productReviewMessage" class="product-review-message" aria-live="polite"></p>

</form>

</div>

</div>

</section>

<script src="script.js?v=20260519-customer-ratings"></script>
<script src="products.js?v=20260518"></script>
